services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gmc_feed}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opt-in: docker compose --profile ai-cache up -d redis
  # Required only when REDIS_URL / REDIS_HOST points at it; never a default.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["ai-cache"]
    ports:
      - "6379:6379"

volumes:
  postgres_data:
