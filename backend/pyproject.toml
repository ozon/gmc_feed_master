[project]
name = "gmc-feed-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "sqlalchemy==2.0.43",
  "asyncpg==0.30.0",
  "argon2-cffi==25.1.0",
  "apscheduler==3.11.3",
  "jsonschema==4.26.0",
  "pillow>=10.4,<11",
]

[dependency-groups]
dev = [
  "alembic==1.16.4",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "pytest-postgresql==8.1.0",
  "pytest-xdist==3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]
