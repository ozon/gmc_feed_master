[project]
name = "gmc-feed-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "sqlalchemy==2.0.43",
  "structlog>=25.1,<27",
  "asyncpg==0.30.0",
  "argon2-cffi==25.1.0",
  "apscheduler==3.11.3",
  "jsonschema==4.26.0",
  "pillow==12.3.0",
  "litellm==1.101.0",
  "instructor==1.17.0",
  "redis==8.1.0",
  "diskcache==5.6.3",
  "alembic==1.16.4",
]

[dependency-groups]
dev = [
  "mypy>=2.3.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "pytest-postgresql==8.1.0",
  "pytest-xdist==3.8.0",
  "pytest-reportlog",
  "pytest-cov==7.1.0",
  "ruff==0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 85

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jsonschema.*", "apscheduler.*", "asyncpg"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plugin"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["litellm.*", "litellm", "instructor.*", "instructor"]
ignore_missing_imports = true

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]
