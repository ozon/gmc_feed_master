name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-session-secret
      INITIAL_USERNAME: ci-user
      INITIAL_PASSWORD: ci-only-password
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gmc_feed
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gmc_feed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start and wait for PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Check GMC registry artifact
        working-directory: backend
        run: uv run python scripts/registry_check.py --source ../gmc_def.md --output registry/attributes.json --check
      - name: Run alembic migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Run backend tests and compile checks
        working-directory: backend
        run: uv run pytest -q && uv run python -m compileall app alembic registry
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests, typecheck, and build
        working-directory: frontend
        run: npm test -- --run && npm run typecheck && npm run build
