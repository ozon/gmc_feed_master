name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: gmc_feed
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gmc_feed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      SESSION_SECRET: ci-only-session-secret
      INITIAL_USERNAME: ci-user
      INITIAL_PASSWORD: ci-only-password
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gmc_feed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Run backend tests and compile checks
        working-directory: backend
        run: uv run pytest -q && uv run python -m compileall app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests, typecheck, and build
        working-directory: frontend
        run: npm test -- --run && npm run typecheck && npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
